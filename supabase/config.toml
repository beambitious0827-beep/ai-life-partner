# project_id はlocal開発でのプロジェクト名として使う。
# remote projectはまだ作っていないため、project-refはここに書かない。
# link / deploy / secret set も行っていない。
project_id = "ai-life-partner"

# reflection-thinking はサインインしたHuman専用の窓口である。
# publicなendpointではないので、JWTの検証を明示して有効にする。
